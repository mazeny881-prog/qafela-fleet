<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - Unauthorized</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 480px;
            border: none;
            border-radius: 1rem;
        }
        .icon-container {
            font-size: 3rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100">
    <div class="card error-card text-center p-5 shadow-sm bg-white mb-3">
        <div class="icon-container mb-3">🛡️</div>
        <h2 class="fw-bold text-dark mb-2">Access Denied</h2>
        <p class="text-muted mb-4">Sorry, this page is restricted to Developers and System Administrators only. Your account does not have the required permissions to view it.</p>
        <div>
            <a href="/" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">Back to Dashboard</a>
        </div>
    </div>
    <footer class="text-center text-muted small">
        <p class="mb-1">Developed by <strong>Mazen Yasser</strong></p>
        <p class="mb-0">&copy; 2026 Qafela Heavy Fleet Management System. All rights reserved.</p>
    </footer>
</body>
</html>
